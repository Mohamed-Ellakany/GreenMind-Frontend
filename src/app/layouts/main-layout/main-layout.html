<div class="app-shell min-h-dvh" dir="rtl">
  @if (mobileMenuOpen()) {
    <button class="fixed inset-0 z-40 bg-[#10231b]/45 backdrop-blur-[2px] lg:hidden" aria-label="إغلاق القائمة" (click)="closeMobileMenu()"></button>
  }

  <aside class="floating-aside fixed inset-y-0 right-0 z-50 flex w-[278px] flex-col border-l border-[#dde6df] bg-white" [class.is-open]="mobileMenuOpen()" [class.floating-aside-collapsed]="asideCollapsed()">
    <button class="aside-collapse-button hidden lg:grid" type="button" aria-label="تصغير القائمة" [attr.aria-expanded]="!asideCollapsed()" (click)="toggleAside()">
      <fa-icon [icon]="icons.collapse" />
    </button>

    <div class="border-b border-[#edf1ee] px-5 py-5">
      <a routerLink="/dashboard" class="brand-link flex items-center gap-3" title="جرين مايند" (click)="closeMobileMenu()">
        <span class="grid size-11 shrink-0 place-items-center rounded-2xl bg-[#e7f5eb] text-xl text-[#0f7a3d]" aria-hidden="true"><fa-icon [icon]="icons.leaf" /></span>
        <span class="aside-text min-w-0"><strong class="block text-lg font-black tracking-tight text-[#10231b]">جرين مايند</strong><small class="block text-xs text-[#738078]">منصة التصدير الزراعي</small></span>
      </a>
    </div>

    <div class="aside-text mx-4 mt-4 rounded-2xl border border-[#dbe9de] bg-[#f3faf5] p-3">
      <div class="flex items-center gap-3"><span class="grid size-9 place-items-center rounded-xl bg-white text-[#0f7a3d] shadow-sm"><fa-icon [icon]="icons.seedling" /></span><div class="min-w-0"><p class="truncate text-xs text-[#65736c]">مساحة العمل</p><p class="truncate text-sm font-bold text-[#10231b]">مزرعة الإسماعيلية</p></div></div>
    </div>

    <nav class="aside-scroll min-h-0 flex-1 overflow-y-auto overflow-x-hidden px-3 py-5 text-sm" aria-label="التنقل الرئيسي">
      <p class="aside-text mb-2 px-3 text-[11px] font-bold text-[#8a968f]">نظرة عامة</p>
      <div class="space-y-1">
        <a routerLink="/dashboard" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" title="لوحة التحكم" (click)="closeMobileMenu()"><fa-icon class="nav-fa" [icon]="icons.dashboard" /><span class="aside-text">لوحة التحكم</span></a>
        <a routerLink="/activities" routerLinkActive="nav-link-active" class="nav-link" title="المهام والأنشطة" (click)="closeMobileMenu()"><fa-icon class="nav-fa" [icon]="icons.activities" /><span class="aside-text">المهام والأنشطة</span></a>
      </div>
      <p class="aside-text mb-2 mt-6 px-3 text-[11px] font-bold text-[#8a968f]">التصدير والامتثال</p>
      <div class="space-y-1">
        <a routerLink="/export-plans" routerLinkActive="nav-link-active" class="nav-link" title="خطط التصدير" (click)="closeMobileMenu()"><fa-icon class="nav-fa" [icon]="icons.exportPlans" /><span class="aside-text">خطط التصدير</span></a>
        <a routerLink="/market-comparison" routerLinkActive="nav-link-active" class="nav-link" title="مقارنة الأسواق" (click)="closeMobileMenu()"><fa-icon class="nav-fa" [icon]="icons.market" /><span class="aside-text">مقارنة الأسواق</span></a>
        <a routerLink="/ai-agent" routerLinkActive="nav-link-active" class="nav-link" title="المستشار الذكي" (click)="closeMobileMenu()"><fa-icon class="nav-fa" [icon]="icons.ai" /><span class="aside-text">المستشار الذكي</span><span class="aside-text mr-auto rounded-full bg-[#d8f36a] px-2 py-0.5 text-[9px] font-black text-[#31430b]">AI</span></a>
      </div>
    </nav>

    <div class="border-t border-[#edf1ee] p-3 text-sm">
      <a href="#help" class="nav-link" title="مركز المساعدة"><fa-icon class="nav-fa" [icon]="icons.help" /><span class="aside-text">مركز المساعدة</span></a>
      <button type="button" class="nav-link w-full text-[#9c3732] hover:bg-red-50" title="تسجيل الخروج" (click)="logout()"><fa-icon class="nav-fa" [icon]="icons.logout" /><span class="aside-text">تسجيل الخروج</span></button>
    </div>
  </aside>

  <div class="layout-content min-h-dvh" [class.layout-content-collapsed]="asideCollapsed()">
    <header class="sticky top-0 z-30 flex h-[72px] items-center gap-3 border-b border-[#dde6df] bg-white/90 px-4 backdrop-blur-xl sm:px-7">
      <button class="grid size-10 place-items-center rounded-xl border border-[#dde6df] text-lg lg:hidden" aria-label="فتح القائمة" [attr.aria-expanded]="mobileMenuOpen()" (click)="openMobileMenu()"><fa-icon [icon]="icons.burger" /></button>
      <div class="relative hidden w-full max-w-[440px] md:block">
        <fa-icon class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-[#849087]" [icon]="icons.search" />
        <input class="h-11 w-full rounded-xl border bg-[#f7f9f7] pr-11 pl-4 text-sm placeholder:text-[#8a968f]" placeholder="ابحث في الخطط والمهام والأسواق" aria-label="البحث" />
      </div>
      <div class="mr-auto flex items-center gap-2 sm:gap-3">
        <span class="hidden items-center gap-2 rounded-full border border-[#dbe9de] bg-[#f3faf5] px-3 py-2 text-xs font-bold text-[#0f7a3d] sm:inline-flex"><i class="size-1.5 rounded-full bg-[#20a958]"></i> الأنظمة تعمل</span>
        <button class="relative grid size-10 place-items-center rounded-xl border border-[#dde6df] bg-white text-[#415047] hover:bg-[#f7f9f7]" aria-label="الإشعارات"><fa-icon [icon]="icons.bell" /><i class="absolute left-2.5 top-2 size-2 rounded-full border-2 border-white bg-[#dc5a50]"></i></button>
        <button class="flex h-10 items-center gap-2 rounded-xl border border-[#dde6df] bg-white px-2 text-[#415047] hover:bg-[#f7f9f7]" aria-label="الحساب"><span class="grid size-7 place-items-center rounded-lg bg-[#10231b] text-xs font-bold text-white">م</span><span class="hidden text-right text-xs sm:block"><strong class="block text-[#10231b]">محمد أحمد</strong><small class="text-[#738078]">مالك مزرعة</small></span></button>
      </div>
    </header>
    <main class="p-4 sm:p-7 lg:p-8"><router-outlet /></main>
  </div>
</div>
