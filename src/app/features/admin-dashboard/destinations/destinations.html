<section class="mx-auto max-w-[1200px] text-[#001c37]" dir="rtl"><header class="mb-8"><h1 class="text-3xl font-black">وجهات التصدير</h1><p class="mt-2 text-sm text-slate-500">الوجهات المتاحة للمزارعين ومعلوماتها التخطيطية.</p></header>@if (error()) { <p class="mb-4 rounded-lg bg-red-50 p-4 text-red-700">{{ error() }}</p> }<form class="mb-6 grid gap-3 rounded-xl bg-white p-5 shadow-sm md:grid-cols-[1fr_2fr_auto]" (ngSubmit)="save()"><input required class="rounded-lg border p-3" placeholder="اسم الوجهة" name="name" [(ngModel)]="name" /><input class="rounded-lg border p-3" placeholder="الوصف أو متطلبات التصدير" name="description" [(ngModel)]="description" /><div class="flex gap-2"><button class="rounded-lg bg-[#16a34a] px-5 py-3 font-bold text-white">{{ editingId ? 'حفظ' : 'إضافة' }}</button>@if (editingId) { <button type="button" class="rounded-lg border px-4" (click)="cancel()">إلغاء</button> }</div></form><div class="overflow-hidden rounded-xl bg-white shadow-sm"><table class="w-full text-right"><thead class="bg-slate-50 text-xs text-slate-500"><tr><th class="p-4">الوجهة</th><th class="p-4">الوصف</th><th class="p-4">الحالة</th><th class="p-4">الإجراءات</th></tr></thead><tbody>@for (item of items(); track item.id) { <tr class="border-t"><td class="p-4 font-bold">{{ item.name }}</td><td class="p-4 text-sm text-slate-500">{{ item.description || '—' }}</td><td class="p-4">{{ item.isActive ? 'متاحة' : 'غير متاحة' }}</td><td class="p-4"><button class="ml-3 text-blue-700" (click)="edit(item)">تعديل</button><button class="text-red-700" (click)="toggle(item)">{{ item.isActive ? 'تعطيل' : 'تفعيل' }}</button></td></tr> }</tbody></table></div></section>
