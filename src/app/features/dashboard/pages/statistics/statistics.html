<section class="mx-auto max-w-4xl" dir="rtl">
  <header class="mb-6"><p class="text-xs font-black text-[#0f7a3d]">بيانات مزرعتك</p><h1 class="text-3xl font-black">الإحصائيات والتقارير</h1><p class="mt-2 text-sm text-[#65736c]">أنشئ تقريراً يشمل المصروفات الفعلية والميزانيات وخطط التصدير والمهام.</p></header>
  <article class="rounded-2xl border bg-white p-6"><div class="grid gap-4 sm:grid-cols-2"><label>من<input [(ngModel)]="from" type="date" class="mt-1 block w-full rounded-xl border p-3"></label><label>إلى<input [(ngModel)]="to" type="date" class="mt-1 block w-full rounded-xl border p-3"></label></div><div class="mt-5 flex flex-wrap gap-5"><label><input [(ngModel)]="spending" type="checkbox"> المصروفات والميزانيات</label><label><input [(ngModel)]="plans" type="checkbox"> خطط التصدير</label><label><input [(ngModel)]="tasks" type="checkbox"> المهام</label></div><div class="mt-6 flex gap-3"><select [(ngModel)]="format" class="rounded-xl border px-4"><option value="pdf">PDF</option><option value="xlsx">Excel</option><option value="csv">CSV</option></select><button (click)="download()" [disabled]="busy()" class="rounded-xl bg-[#0f7a3d] px-5 py-3 font-black text-white">{{busy() ? 'جارٍ الإنشاء...' : 'تنزيل التقرير'}}</button></div></article>
</section>
