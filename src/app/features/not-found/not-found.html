<main class="grid min-h-dvh place-items-center bg-[#f4f7f4] p-5 text-[#10231b]" dir="rtl">
  <section class="w-full max-w-xl rounded-3xl border border-[#dce6df] bg-white p-8 text-center shadow-[0_20px_55px_rgba(16,35,27,.08)] sm:p-12" aria-labelledby="not-found-heading">
    <a routerLink="/" class="mx-auto grid size-14 place-items-center rounded-2xl bg-[#e7f5eb]" aria-label="جرين مايند - الرئيسية"><img class="size-9" src="/greenmind-leaf.svg" width="36" height="36" alt="" /></a>
    <p class="mt-7 text-sm font-black text-[#0f7a3d]">خطأ 404</p>
    <h1 id="not-found-heading" class="mt-2 text-3xl font-black tracking-tight sm:text-4xl">هذه الصفحة غير موجودة</h1>
    <p class="mx-auto mt-4 max-w-md text-sm leading-7 text-[#65736c]">قد يكون الرابط قديماً أو كُتب بطريقة غير صحيحة. يمكنك العودة بأمان ومتابعة عملك.</p>
    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
      <a [routerLink]="homeUrl" class="inline-flex min-h-12 items-center justify-center rounded-xl bg-[#0f7a3d] px-6 text-sm font-black text-white">{{ homeLabel }}</a>
      <a routerLink="/" fragment="contact" class="inline-flex min-h-12 items-center justify-center rounded-xl border border-[#dce6df] bg-white px-6 text-sm font-black">تواصل مع الدعم</a>
    </div>
  </section>
</main>
